    <text x="646" y="191" fill="#8cabb0" font-size="14">Store: ~/.config/envman/environment.conf</text>
    <text x="1030" y="191" fill="#f7fbfa" font-size="16">Mode: Manage</text>
    <line x1="646" y1="211" x2="1198" y2="211" stroke="#2d5960" stroke-width="2"/>
