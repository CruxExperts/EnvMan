  </g>
  <text x="72" y="220" fill="#f7fbfa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="760">Set variables once.</text>
  <text x="72" y="271" fill="#f7fbfa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="760">Load them in new shells.</text>
  <text x="72" y="330" fill="#b9cdd0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">One managed store. Edit in the terminal;</text>
  <text x="72" y="362" fill="#b9cdd0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">use the CLI from your scripts.</text>

