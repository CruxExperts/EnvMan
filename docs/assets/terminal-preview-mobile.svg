  </metadata>
  <rect width="720" height="1200" rx="16" fill="#071b22"/>
  <rect x="1" y="1" width="718" height="1198" rx="15" fill="none" stroke="#2d5960" stroke-width="2"/>
  <circle cx="38" cy="36" r="7" fill="#f36f56"/>
  <circle cx="62" cy="36" r="7" fill="#f3c86a"/>
  <circle cx="86" cy="36" r="7" fill="#72d7a1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="34" y="91" fill="#77dfe5" font-size="33" font-weight="700">Envman / Managed variables</text>
    <text x="34" y="137" fill="#b9cdd0" font-size="30">Store: ~/.config/envman/...</text>
    <text x="34" y="176" fill="#f7fbfa" font-size="30">Mode: Manage</text>
    <line x1="34" y1="204" x2="686" y2="204" stroke="#2d5960" stroke-width="2"/>
    <text x="34" y="248" fill="#b9cdd0" font-size="30">1 selected · 3 shown</text>
    <rect x="27" y="272" width="666" height="108" rx="6" fill="#0e5059"/>
    <text x="46" y="313" fill="#dfff72" font-size="30" font-weight="700">[*] PROJECT_PATH</text>
    <text x="78" y="354" fill="#77dfe5" font-size="30">/srv/envman</text>
    <text x="46" y="425" fill="#b9cdd0" font-size="30">[ ] SERVICE_URL</text>
    <text x="78" y="466" fill="#b9cdd0" font-size="29">https://service.example</text>
    <text x="46" y="537" fill="#b9cdd0" font-size="30">[ ] SERVICE_API_TOKEN</text>
    <text x="78" y="578" fill="#f3c86a" font-size="29">tok_••••••••_6b2f</text>
    <line x1="34" y1="617" x2="686" y2="617" stroke="#2d5960" stroke-width="2"/>
    <text x="34" y="663" fill="#8cabb0" font-size="30">FOCUSED VALUE</text>
    <text x="34" y="708" fill="#f7fbfa" font-size="30" font-weight="700">PROJECT_PATH</text>
    <text x="325" y="708" fill="#77dfe5" font-size="29">/srv/envman</text>
    <text x="34" y="750" fill="#b9cdd0" font-size="28">public · saved · selected</text>
    <line x1="34" y1="780" x2="686" y2="780" stroke="#2d5960" stroke-width="2"/>
    <text x="34" y="825" fill="#dfff72" font-size="29" font-weight="700">A</text><text x="65" y="825" fill="#f7fbfa" font-size="29">Add</text>
    <text x="365" y="825" fill="#dfff72" font-size="29" font-weight="700">E</text><text x="396" y="825" fill="#f7fbfa" font-size="29">Edit</text>
    <text x="34" y="874" fill="#dfff72" font-size="29" font-weight="700">I</text><text x="65" y="874" fill="#f7fbfa" font-size="29">Preview import</text>
    <text x="365" y="874" fill="#dfff72" font-size="29" font-weight="700">B</text><text x="396" y="874" fill="#f7fbfa" font-size="29">Backup</text>
    <text x="34" y="923" fill="#dfff72" font-size="29" font-weight="700">O</text><text x="65" y="923" fill="#f7fbfa" font-size="29">Order</text>
    <text x="365" y="923" fill="#dfff72" font-size="29" font-weight="700">F</text><text x="396" y="923" fill="#f7fbfa" font-size="29">Filter</text>
    <text x="34" y="972" fill="#dfff72" font-size="29" font-weight="700">Q</text><text x="65" y="972" fill="#f7fbfa" font-size="29">Child shell</text>
    <text x="365" y="972" fill="#dfff72" font-size="28" font-weight="700">Esc</text><text x="438" y="972" fill="#f7fbfa" font-size="28">Child shell</text>
    <rect x="27" y="1020" width="666" height="138" rx="6" fill="#dfff72"/>
    <text x="47" y="1066" fill="#10252c" font-size="29" font-weight="700">Sample data only.</text>
    <text x="47" y="1107" fill="#10252c" font-size="27">Sensitive values stay masked</text>
    <text x="47" y="1140" fill="#10252c" font-size="27">in ordinary output.</text>
  </g>
</svg>
