<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc">
  <title id="title">Envman terminal UI mobile preview</title>
  <desc id="desc">A large-print, synthetic Envman variable catalog with a selected project path, sample service URL, masked API token, focus details, and controls.</desc>
  <metadata>
    <dc:title>Envman mobile terminal UI preview</dc:title>
    <dc:creator>Crux Experts LLC</dc:creator>
    <dc:source>https://www.cruxexperts.com/</dc:source>
